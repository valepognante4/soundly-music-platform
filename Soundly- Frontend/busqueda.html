<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar | Soundly</title>
    <meta name="description" content="Buscá canciones, artistas y más en Soundly">
    <link rel="icon" type="image/png" href="images/soundly-logo-2048px.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/busqueda.css">
    <link rel="stylesheet" href="css/player-global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="dark-theme">

    <div class="layout-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <img src="images/soundly-logo-2048px.png" alt="Logo Soundly" class="logo-img">
                Soundly
            </div>
            <nav>
                <a href="home.html"><i class="fas fa-home"></i> Inicio</a>
                <a href="#" class="active"><i class="fas fa-search"></i> Buscar</a>
                <a href="favoritos.html"><i class="fas fa-heart"></i> Tus Me Gusta</a>
                <div class="sidebar-header">
                    <h3>Tu Biblioteca</h3>
                    <button class="btn-sidebar-create">
                        <i class="fas fa-plus"></i> Crear Playlist
                    </button>
                </div>
                <!-- Playlists dinámicas del usuario -->
                <div id="sidebar-playlists"></div>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <!-- Barra de Búsqueda -->
            <section class="search-header">
                <div class="search-bar-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text"
                           id="search-input"
                           placeholder="¿Qué querés escuchar hoy?"
                           autocomplete="off"
                           aria-label="Buscar canciones, artistas o géneros">
                    <button id="search-clear-btn" class="clear-btn" hidden aria-label="Limpiar búsqueda">×</button>
                </div>
            </section>

            <!-- Categorías: Solo se ven si no se está buscando -->
            <section id="categories-section" class="categories-section">
                <h2>Explorar todo</h2>
                <ul id="categories-grid" class="categories-grid">
                    <!-- Dinámico: JS inyectará tarjetas aquí -->
                </ul>
            </section>

            <!-- Resultados de Búsqueda -->
            <section id="search-results" class="search-results" hidden>
                <!-- Vista.renderizarResultadosBusqueda() inyecta aquí -->
            </section>
        </main>

    </div>

    <!-- ══════════════════════════════════════════════════════════════════════
         REPRODUCTOR GLOBAL FIJO — GLASSMORPHISM
         ══════════════════════════════════════════════════════════════════════ -->
    <footer id="global-player-bar" role="complementary" aria-label="Reproductor de música">

        <div class="gp-now-playing">
            <img id="np-art"
                 src="https://placehold.co/52x52/1a1a2e/a78bfa?text=♪"
                 alt="Portada del álbum">
            <div class="gp-np-info">
                <div id="np-title">Seleccioná una canción</div>
                <div id="np-artist">—</div>
            </div>
            <button id="np-like" aria-label="Me gusta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
            </button>
        </div>

        <div class="gp-center">
            <div class="gp-ctrl-row">
                <button class="gp-ctrl-btn" id="btn-shuffle" data-action="shuffle" aria-label="Aleatorio">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                        <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                    </svg>
                </button>
                <button class="gp-ctrl-btn" id="btn-prev" data-action="prev" aria-label="Anterior">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button id="btn-play" aria-label="Reproducir / Pausar">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <polygon points="5,3 19,12 5,21"/>
                    </svg>
                </button>
                <button class="gp-ctrl-btn" id="btn-next" data-action="next" aria-label="Siguiente">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
                <button class="gp-ctrl-btn" id="btn-repeat" data-action="repeat" aria-label="Repetir">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                        <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                    </svg>
                </button>
            </div>

            <div class="gp-progress-row">
                <span class="gp-time" id="p-current">0:00</span>
                <div id="progress-track" role="progressbar" aria-label="Progreso de reproducción">
                    <div id="p-fill"></div>
                </div>
                <span class="gp-time" id="p-total">0:00</span>
            </div>
        </div>

        <div class="gp-extras">
            <button id="vol-btn" aria-label="Volumen">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>
            <input type="range" id="vol-slider" min="0" max="100" value="80" aria-label="Control de volumen">
        </div>

    </footer>

    <!-- Modal Crear Playlist -->
    <div id="modal-crear-playlist" class="modal-overlay">
        <div class="modal-content">
            <h2>Crear Nueva Playlist</h2>
            <input type="text" id="input-nombre-playlist" placeholder="Nombre de la playlist" autocomplete="off">
            <div id="modal-error-message"></div>
            <div class="modal-actions">
                <button id="btn-cancelar" class="btn-secundario">Cancelar</button>
                <button id="btn-guardar" class="btn-primario">Guardar</button>
            </div>
        </div>
    </div>

    <!-- ORDEN DE CARGA OBLIGATORIO -->
    <script src="js/config.js"></script>
    <script src="js/modelo.js"></script>
    <script src="js/modelo-canciones.js"></script>
    <script src="js/reproductor-global.js"></script>
    <script src="js/vista.js"></script>
    <script src="js/controlador-busqueda.js"></script>
</body>

</html>
