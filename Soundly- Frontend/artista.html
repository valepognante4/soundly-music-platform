<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundly | Artista</title>
    <meta name="description" content="Escuchá a tus artistas favoritos en Soundly.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/playlist.css">
    <link rel="stylesheet" href="css/player-global.css">
    <style>
        .artist-hero-banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 32px 24px;
            background: linear-gradient(180deg, rgba(29, 185, 84, 0.4) 0%, rgba(10, 10, 10, 0) 100%);
            gap: 16px;
            margin-bottom: 24px;
        }
        .artist-banner-icon {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            margin: 0 auto;
        }
        .artist-banner-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .artist-banner-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .artist-banner-type {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .artist-title-container h1 {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            margin: 0;
            letter-spacing: -0.04em;
        }
        .album-section {
            margin-bottom: 48px;
            padding: 0 32px;
        }
        .album-section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .album-section-cover {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            object-fit: cover;
        }
        .album-section-title {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .album-section-year {
            color: var(--muted);
            font-size: 1rem;
        }
    </style>
</head>

<body class="home-layout">
    <div class="app-wrapper">
        <main class="main-content" id="content">
            <!-- BANNER (encabezado visual del artista) -->
            <header class="artist-hero-banner">
                <div class="artist-banner-icon" id="artista-cover-container">
                    <img id="artista-cover-img" src="https://placehold.co/192x192/1a1a2e/a78bfa?text=Artista" alt="Artista">
                </div>
                <div class="artist-banner-text">
                    <span class="artist-banner-type">Artista</span>
                    <div class="artist-title-container">
                        <h1 id="artista-name">Cargando...</h1>
                    </div>
                </div>
            </header>

            <div id="artista-albums-container">
                <!-- Álbumes y canciones se inyectan aquí -->
                <div class="loading-placeholder" style="padding: 32px;">Cargando álbumes y canciones...</div>
            </div>
        </main>
    </div>
</body>
</html>
