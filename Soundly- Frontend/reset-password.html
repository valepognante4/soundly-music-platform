<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña - Soundly</title>
    <meta name="description" content="Restablecé tu contraseña de Soundly de forma segura.">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="images/soundly-logo-2048px.png">
    <style>
        /* ── Estado de error: token inválido o ausente ── */
        #error-token {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 1.2rem;
            text-align: center;
            padding: 2rem;
        }
        #error-token .error-icon { font-size: 3.5rem; }
        #error-token h2 { color: #fff; font-size: 1.5rem; }
        #mensaje-error-token { color: rgba(255,255,255,0.65); font-size: 0.95rem; max-width: 420px; line-height: 1.6; }
        #error-token a {
            display: inline-block;
            margin-top: 0.5rem;
            color: #a855f7;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid #a855f7;
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            transition: background 0.2s;
        }
        #error-token a:hover { background: rgba(168,85,247,0.15); }

        /* ── Formulario principal ── */
        #contenedor-formulario { display: block; }

        .input-group { position: relative; }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.5);
            padding: 0;
            line-height: 1;
        }
        .toggle-password:hover { color: #fff; }

        /* Mensaje de error inline (sin Swal) */
        #error-match {
            display: none;
            color: #f87171;
            font-size: 0.82rem;
            margin-top: -8px;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        /* Indicador de fortaleza de contraseña */
        .strength-bar-wrap {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            margin-bottom: 2px;
        }
        .strength-bar-wrap span {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.12);
            transition: background 0.3s;
        }
        .strength-label {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.45);
            margin-bottom: 8px;
            min-height: 1rem;
            transition: color 0.3s;
        }

        /* Botón en estado loading */
        button.loading { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>

<body>

    <!-- Estado de error: token inválido o ausente (JS lo hace visible si falla la guardia) -->
    <div id="error-token">
        <span class="error-icon">🔗</span>
        <h2>Enlace inválido</h2>
        <p id="mensaje-error-token">Este enlace es inválido o ya expiró.</p>
        <a href="login.html">Volver al login y solicitar uno nuevo</a>
    </div>

    <!-- Formulario principal (visible por defecto, JS lo oculta si el token falla) -->
    <div id="contenedor-formulario">
        <main class="login-container">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>

            <form id="form-reset-password" novalidate>

                <div class="brand-inside logo-redirect" onclick="window.location.href='index.html'" role="link" aria-label="Ir al inicio" tabindex="0">
                    <img src="images/soundly-logo-2048px.png" alt="Soundly" width="60">
                    <span class="brand-title">Soundly</span>
                </div>

                <h2>Creá tu nueva contraseña</h2>
                <p style="color:rgba(255,255,255,0.55); font-size:0.9rem; margin-bottom:1.4rem; text-align:center;">
                    Elegí una contraseña segura de al menos 8 caracteres.
                </p>

                <!-- Nueva contraseña -->
                <div class="input-group">
                    <input
                        type="password"
                        id="nueva-password"
                        name="nuevaPassword"
                        placeholder="Nueva contraseña"
                        minlength="8"
                        required
                        autocomplete="new-password"
                    >
                    <button type="button" class="toggle-password" aria-label="Mostrar contraseña">👁️</button>
                </div>

                <!-- Indicador de fortaleza -->
                <div class="strength-bar-wrap">
                    <span id="bar-1"></span>
                    <span id="bar-2"></span>
                    <span id="bar-3"></span>
                    <span id="bar-4"></span>
                </div>
                <p class="strength-label" id="strength-label"></p>

                <!-- Confirmar contraseña -->
                <div class="input-group">
                    <input
                        type="password"
                        id="confirmar-password"
                        name="confirmarPassword"
                        placeholder="Confirmá la contraseña"
                        required
                        autocomplete="new-password"
                    >
                    <button type="button" class="toggle-password" aria-label="Mostrar confirmación">👁️</button>
                </div>

                <!-- Error inline (contraseñas no coinciden, muy corta, etc.) -->
                <p id="error-match"></p>

                <button type="submit" id="btn-reset">Guardar nueva contraseña</button>

                <p class="footer-form">
                    <a href="login.html">← Volver al login</a>
                </p>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/config.js"></script>
    <script src="js/modelo.js"></script>
    <script src="js/controlador-reset-password.js"></script>

    <!-- Indicador de fortaleza de contraseña (inline por simplicidad) -->
    <script>
        document.getElementById('nueva-password').addEventListener('input', function () {
            const val = this.value;
            const nivel = calcularFortaleza(val);
            const colores = ['', '#ef4444', '#f97316', '#eab308', '#22c55e'];
            const etiquetas = ['', 'Muy débil', 'Débil', 'Aceptable', 'Fuerte'];

            for (let i = 1; i <= 4; i++) {
                document.getElementById(`bar-${i}`).style.background =
                    i <= nivel ? colores[nivel] : 'rgba(255,255,255,0.12)';
            }
            const label = document.getElementById('strength-label');
            label.textContent = val.length ? etiquetas[nivel] : '';
            label.style.color = colores[nivel] || 'rgba(255,255,255,0.45)';
        });

        function calcularFortaleza(p) {
            if (p.length < 6) return 1;
            let puntos = 0;
            if (p.length >= 8)  puntos++;
            if (/[A-Z]/.test(p)) puntos++;
            if (/[0-9]/.test(p)) puntos++;
            if (/[^A-Za-z0-9]/.test(p)) puntos++;
            return Math.min(4, Math.max(1, puntos));
        }
    </script>

</body>
</html>
