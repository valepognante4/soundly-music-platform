spring.application.name=soundly

spring.datasource.url=jdbc:mysql://localhost:3306/soundly_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=ides

# El Driver de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# "update" lee tus clases @Entity y dibuja las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Te muestra en la consola las consultas SQL reales para que veas cómo se crean las tablas
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto optimizado para MySQL 8 o superior
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# BATCH INSERT: Hibernate agrupa INSERTs en lotes de 50 en vez de uno por uno
# ===================================================================
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================================================
# LOGGING (reducido para producción, sube a DEBUG si necesitas depurar)
# ===================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===================================================================
# CONFIGURACIÓN CRÍTICA CONTRA CUELGUES Y FALLOS SILENCIOSOS
# ===================================================================

# 1. Desactivar OSIV: Evita que el EntityManager quede abierto durante toda
# la petición HTTP y acumule miles de objetos hasta agotar la memoria.
spring.jpa.open-in-view=false

# 2. Configurar el pool de conexiones HikariCP para evitar esperas infinitas (deadlocks)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.main.allow-circular-references=true